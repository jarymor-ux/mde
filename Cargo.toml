[package]
name = "mde"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A small, fast native Markdown editor and viewer"
license-file = "LICENSE"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_commonmark = "0.25.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter-highlight = "0.27"
tree-sitter-md = { version = "0.5.3", default-features = false }
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-bash = "0.25.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
